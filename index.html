<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умная Читалка</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
        textarea { width: 100%; height: 200px; margin-bottom: 15px; border-radius: 8px; padding: 10px; border: 1px solid #ccc; font-size: 16px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; color: white; font-weight: bold; }
        .btn-clean { background: #2196F3; }
        .btn-play { background: #4CAF50; }
        .btn-stop { background: #F44336; }
        #output { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; min-height: 100px; white-space: pre-wrap; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>
<h2>Умная Читалка (Очистка + TTS)</h2>
<textarea id="rawInput" placeholder="Вставьте сюда скопированный из PDF текст с тире и колонтитулами..."></textarea>

<div class="controls">
    <button class="btn-clean" onclick="handleClean()">Очистить текст</button>
    <button class="btn-play" onclick="handlePlay()">Слушать</button>
    <button class="btn-stop" onclick="handleStop()">Стоп</button>
</div>

<h3>Очищенный текст для чтения:</h3>
<div id="output"></div>

<script src="app.js"></script>
</body>
</html>
